# --- 1GB VPS memory budget (shared host) -------------------------------------
# Host has 1024MB total AND already runs other apps, so the stack caps itself
# well below that and leaves plenty of headroom for the OS, Docker overhead,
# and the host's existing apps. Limits are hard OOM-kill ceilings;
# reservations are soft guarantees used for placement.
#   api:    limit 350m / reserve 200m — single uvicorn worker + SQLAlchemy;
#           Argon2id hashing spikes per login, hence the higher reservation.
#   web:    limit 64m  / reserve 32m  — static nginx serving a prebuilt
#           bundle; RSS is essentially the nginx master + 1 worker.
# Sum of limits = 414MB. Code execution runs on Cloud Run (see JUDGE_URL), so
# no judge container is needed here.
#
# The former `piston` service was removed: nothing ever called it. The API's
# judge ran submissions in its own container the whole time, and Piston had no
# runtimes installed, so it was 300MB of idle container on a 951MB host.
# -----------------------------------------------------------------------------

services:
  # 1. FastAPI Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: merit-api
    restart: unless-stopped
    mem_limit: 350m
    mem_reservation: 200m
    # The judge runs untrusted submissions in this container. A PID cap is the
    # structural backstop against a fork bomb: RLIMIT_NPROC is per-UID across
    # the host, so it cannot be used for this (it also counts the API's own
    # threads and stops Node from starting).
    pids_limit: 256
    environment:
      - ENVIRONMENT=production
      # Local default stays SQLite (zero friction: no env needed).
      # Neon prod override (VPS only, never commit the URL — export it):
      #   export DATABASE_URL='postgresql+psycopg://USER:PASSWORD@HOST/dbname?sslmode=require'
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/merit.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://127.0.0.1"]
      # OAuth (empty = disabled with 501; set on VPS, never commit).
      - CLERK_JWKS_URL=${CLERK_JWKS_URL:-}
      - CLERK_AUDIENCE=${CLERK_AUDIENCE:-}
      # GitHub Issue forwarding for in-app user feedback
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-abhigyan-chatterjee/merit}
      # Remote judge on Cloud Run. Leave JUDGE_URL empty to run the local
      # sandbox instead; setting it requires the service-account path below.
      - JUDGE_URL=${JUDGE_URL:-}
      - JUDGE_TIMEOUT_SEC=${JUDGE_TIMEOUT_SEC:-60}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - merit-data:/data
      # Service-account key for the judge identity, read-only. Put the JSON at
      # .judge/judge-sa.json on the host (gitignored) and set
      # GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/judge-sa.json.
      # An empty directory here is harmless: it is only read when JUDGE_URL is
      # set, and startup validation refuses that combination without it.
      - ${JUDGE_SA_DIR:-./.judge}:/run/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - merit-net

  # 3. Static Web Frontend with Nginx & SPA Fallback
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
        - VITE_CLERK_JWT_TEMPLATE=${VITE_CLERK_JWT_TEMPLATE:-merit}
    container_name: merit-web
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    # Localhost-only: TLS + public traffic go through the host reverse
    # proxy (Caddy). Never publish the app server directly.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - merit-net

volumes:
  merit-data:

networks:
  merit-net:
    driver: bridge
