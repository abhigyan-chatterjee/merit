name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint

  web-test:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run Vitest
        working-directory: apps/web
        run: npm test

  web-build:
    name: Web Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build Web Bundle
        working-directory: apps/web
        run: npm run build

  api-test:
    name: API Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algovista
          POSTGRES_PASSWORD: algovistapassword
          POSTGRES_DB: algovista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Setup Python
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: apps/api
        run: uv venv && uv pip install -e ".[dev]" psycopg2-binary
      - name: Lint & Typecheck
        working-directory: apps/api
        run: |
          uv run ruff check .
      - name: Run Pytest
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ matrix.db == 'postgresql' && 'postgresql://algovista:algovistapassword@localhost:5432/algovista_test' || 'sqlite:///:memory:' }}
        run: uv run pytest -q

  content-validate:
    name: Content Validation & Verification Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pydantic pyyaml
      - name: Run All Content Validators
        run: python3 content/validators/run_all.py
