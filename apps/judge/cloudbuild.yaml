# Cloud Build config for the Merit judge image.
#
# Driven by apps/judge/deploy.sh, which is the only supported entry point: it
# supplies both substitutions below.
#
# The build context is the REPO ROOT, not apps/judge/, because the Dockerfile
# copies the sandbox directly out of the API so both paths share exactly one
# implementation of code execution.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_DOCKERFILE}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  # Overridden per tier by deploy.sh; light is the safe default. _IMAGE has no
  # default on purpose: deploy.sh is the only entry point, and a default here
  # would let a bare `gcloud builds submit` publish to a guessed tag.
  _DOCKERFILE: apps/judge/Dockerfile
# No machineType override. The free tier covers the default e2-standard-2 in the
# default pool only; every E2_HIGHCPU_8 minute is billed (~$0.008/min, a few
# cents per build here). Leaving this out is what keeps the build free — the
# extra machine bought a faster build, not a working one.
timeout: 1200s
