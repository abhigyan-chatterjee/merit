map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_proto $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers (Nginx drops server-level add_header in any location
    # that defines its own add_header, so static assets below repeat them.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4DyYd34G3ulHGp/EJk3pc4RjRaHrwMaG60+ym77SJb4=' https://*.clerk.accounts.dev https://*.clerk.com https://clerk.merit.nullbit.in https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://img.clerk.com https://*.clerk.com; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://clerk.merit.nullbit.in https://challenges.cloudflare.com https://models.dev; frame-src 'self' https://challenges.cloudflare.com https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # API reverse proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_connect_timeout 15s;
        client_max_body_size 3m;
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA Fallback (Fixes D12)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets while preserving baseline security headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, no-transform" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $hsts_header always;
    }
}
